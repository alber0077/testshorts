[project]
name = "history-shorts-pipeline"
version = "0.1.0"
description = "Local CSV-driven pipeline for grounded historical TikTok/Shorts using Resemble AI Chatterbox TTS and Remotion"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "chatterbox-tts>=0.1.2",
    "httpx>=0.27.2",
    "numpy>=1.26.4,<2.1",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "typer>=0.12.5",
    "whisperx>=3.2.0",
]

[project.scripts]
shorts = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
